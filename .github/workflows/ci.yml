name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=berlin_exposure_twin --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: >-
          python -c 'import json; from berlin_exposure_twin.api import app;
          schema = app.openapi(); assert "/api/v1/exposure/route" in schema["paths"];
          json.dumps(schema); print("OpenAPI schema generated and JSON-serializable")'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker build -t berlin-environmental-exposure-twin:test .

  live-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Berlin air-quality smoke check
        continue-on-error: true
        run: berlin-exposure live-smoke --pollutant no2
      - name: DWD meteorology smoke check
        continue-on-error: true
        run: berlin-exposure dwd-smoke --variable air_temperature
      - name: Real LOSO interpolation validation when coverage permits
        continue-on-error: true
        run: berlin-exposure live-validate --pollutant no2
