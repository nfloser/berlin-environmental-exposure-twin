[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "berlin-environmental-exposure-twin"
version = "0.1.0"
description = "Research-oriented environmental exposure digital twin for Berlin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "mypy>=1.11,<2",
  "ruff>=0.7,<1",
]

[project.scripts]
berlin-exposure = "berlin_exposure_twin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/berlin_exposure_twin"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["berlin_exposure_twin"]
branch = true
